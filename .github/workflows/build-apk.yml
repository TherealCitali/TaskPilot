name: Build signed APKs

on:
  push: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed ABI APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || {
            echo "KEYSTORE is not configured."
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/taskpilot-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/taskpilot-signing/taskpilot-release.jks"
          chmod 600 "$RUNNER_TEMP/taskpilot-signing/taskpilot-release.jks"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build signed release APKs
        env:
          TASKPILOT_KEYSTORE_FILE: ${{ runner.temp }}/taskpilot-signing/taskpilot-release.jks
          TASKPILOT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TASKPILOT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TASKPILOT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Collect architecture-specific APKs
        shell: bash
        run: |
          set -euo pipefail
          output_dir="app/build/outputs/apk/release"
          dist_dir="$RUNNER_TEMP/taskpilot-apks"
          mkdir -p "$dist_dir"

          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            apk="$(find "$output_dir" -maxdepth 1 -type f -name "*${abi}*.apk" | head -n 1 || true)"
            if [ -z "$apk" ]; then
              echo "Missing signed APK for ABI: $abi"
              find "$output_dir" -maxdepth 1 -type f -print || true
              exit 1
            fi
            cp "$apk" "$dist_dir/TaskPilot-${abi}-${GITHUB_SHA::7}.apk"
          done

          test "$(find "$dist_dir" -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 4
          sha256sum "$dist_dir"/*.apk > "$dist_dir/SHA256SUMS"
          find "$dist_dir" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: TaskPilot-signed-${{ github.sha }}
          path: ${{ runner.temp }}/taskpilot-apks/*
          if-no-files-found: error
          retention-days: 14
