name: Build signed APKs

on:
  push: {}
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed ABI APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || {
            echo "KEYSTORE is not configured."
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/taskpilot-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/taskpilot-signing/taskpilot-release.jks"
          chmod 600 "$RUNNER_TEMP/taskpilot-signing/taskpilot-release.jks"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build signed release APKs
        env:
          TASKPILOT_KEYSTORE_FILE: ${{ runner.temp }}/taskpilot-signing/taskpilot-release.jks
          TASKPILOT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TASKPILOT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TASKPILOT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Collect architecture-specific APKs
        shell: bash
        run: |
          set -euo pipefail
          output_root="app/build/outputs/apk"
          dist_dir="$RUNNER_TEMP/taskpilot-apks"
          mkdir -p "$dist_dir"

          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            apk="$(find "$output_root" -type f -path '*/release/*.apk' -name "*${abi}*.apk" | head -n 1 || true)"
            if [ -z "$apk" ]; then
              echo "Missing signed APK for ABI: $abi"
              find "$output_root" -type f -print || true
              exit 1
            fi
            cp "$apk" "$dist_dir/TaskPilot-${abi}-${GITHUB_SHA}.apk"
          done

          test "$(find "$dist_dir" -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 4
          sha256sum "$dist_dir"/*.apk > "$dist_dir/SHA256SUMS"
          find "$dist_dir" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: TaskPilot-arm64-v8a-${{ github.sha }}
          path: ${{ runner.temp }}/taskpilot-apks/TaskPilot-arm64-v8a-${{ github.sha }}.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: TaskPilot-armeabi-v7a-${{ github.sha }}
          path: ${{ runner.temp }}/taskpilot-apks/TaskPilot-armeabi-v7a-${{ github.sha }}.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86 APK
        uses: actions/upload-artifact@v4
        with:
          name: TaskPilot-x86-${{ github.sha }}
          path: ${{ runner.temp }}/taskpilot-apks/TaskPilot-x86-${{ github.sha }}.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: TaskPilot-x86_64-${{ github.sha }}
          path: ${{ runner.temp }}/taskpilot-apks/TaskPilot-x86_64-${{ github.sha }}.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: TaskPilot-checksums-${{ github.sha }}
          path: ${{ runner.temp }}/taskpilot-apks/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Create CI pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="taskpilot-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          title="TaskPilot CI #${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT} (${GITHUB_SHA::7})"
          gh release create "$tag" "$RUNNER_TEMP"/taskpilot-apks/*.apk "$RUNNER_TEMP"/taskpilot-apks/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes "Automated pre-release build for commit ${GITHUB_SHA}. Each APK is architecture-specific." \
            --prerelease

      - name: Keep only the latest 10 CI pre-releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t old_releases < <(
            gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.prerelease == true and (.tag_name | startswith("taskpilot-ci-"))) | [.created_at, (.id | tostring), .tag_name] | @tsv' \
              | sort -r \
              | tail -n +11
          )

          for release in "${old_releases[@]}"; do
            IFS=$'\t' read -r created_at release_id tag <<< "$release"
            echo "Removing old pre-release $tag created at $created_at"
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/releases/${release_id}"
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" || true
          done
