name: Bump version

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: Version component to increment when an exact version is not supplied
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version_name:
        description: Optional exact semantic version, for example 0.2.0
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: bump-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    name: Bump, tag, and publish signed APKs
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Calculate and apply version
        id: version
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
          REQUESTED_VERSION: ${{ inputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          version_match = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          code_match = re.search(r'versionCode\s*=\s*(\d+)', text)
          if not version_match or not code_match:
              raise SystemExit("Could not find versionName and versionCode in app/build.gradle.kts")

          current = version_match.group(1)
          current_parts = current.split(".")
          if len(current_parts) != 3 or not all(part.isdigit() for part in current_parts):
              raise SystemExit(f"Current version is not numeric semantic version: {current}")

          requested = os.environ.get("REQUESTED_VERSION", "").strip()
          if requested:
              if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", requested):
                  raise SystemExit("version_name must match MAJOR.MINOR.PATCH, for example 0.2.0")
              new_version = requested
          else:
              major, minor, patch = map(int, current_parts)
              bump_type = os.environ.get("BUMP_TYPE", "patch")
              if bump_type == "major":
                  major, minor, patch = major + 1, 0, 0
              elif bump_type == "minor":
                  minor, patch = minor + 1, 0
              elif bump_type == "patch":
                  patch += 1
              else:
                  raise SystemExit(f"Unknown bump type: {bump_type}")
              new_version = f"{major}.{minor}.{patch}"

          current_code = int(code_match.group(1))
          new_code = current_code + 1
          text = re.sub(
              r'(versionCode\s*=\s*)\d+',
              rf'\g<1>{new_code}',
              text,
              count=1,
          )
          text = re.sub(
              r'(versionName\s*=\s*)"[^"]+"',
              rf'\g<1>"{new_version}"',
              text,
              count=1,
          )
          path.write_text(text, encoding="utf-8")

          output = os.environ["GITHUB_OUTPUT"]
          with open(output, "a", encoding="utf-8") as handle:
              handle.write(f"version_name={new_version}\n")
              handle.write(f"version_code={new_code}\n")
              handle.write(f"tag=v{new_version}\n")

          print(f"Version: {current} ({current_code}) -> {new_version} ({new_code})")
          PY

      - name: Ensure version tag does not already exist
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Choose another version."
            exit 1
          fi

      - name: Commit and tag version bump
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "chore: bump version to ${VERSION_NAME}"
          git tag -a "$TAG" -m "TaskPilot $TAG"
          git push origin "HEAD:${BRANCH}" --follow-tags

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TASKPILOT_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || {
            echo "TASKPILOT_KEYSTORE_BASE64 is not configured."
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/taskpilot-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/taskpilot-signing/taskpilot-release.jks"
          chmod 600 "$RUNNER_TEMP/taskpilot-signing/taskpilot-release.jks"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build signed release APKs
        env:
          TASKPILOT_KEYSTORE_FILE: ${{ runner.temp }}/taskpilot-signing/taskpilot-release.jks
          TASKPILOT_KEYSTORE_PASSWORD: ${{ secrets.TASKPILOT_KEYSTORE_PASSWORD }}
          TASKPILOT_KEY_ALIAS: ${{ secrets.TASKPILOT_KEY_ALIAS }}
          TASKPILOT_KEY_PASSWORD: ${{ secrets.TASKPILOT_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Collect architecture-specific APKs
        shell: bash
        run: |
          set -euo pipefail
          output_dir="app/build/outputs/apk/release"
          dist_dir="$RUNNER_TEMP/taskpilot-apks"
          mkdir -p "$dist_dir"

          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            apk="$(find "$output_dir" -maxdepth 1 -type f -name "*${abi}*.apk" | head -n 1 || true)"
            if [ -z "$apk" ]; then
              echo "Missing signed APK for ABI: $abi"
              find "$output_dir" -maxdepth 1 -type f -print || true
              exit 1
            fi
            cp "$apk" "$dist_dir/TaskPilot-${abi}-${{ steps.version.outputs.version_name }}.apk"
          done

          test "$(find "$dist_dir" -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 4
          sha256sum "$dist_dir"/*.apk > "$dist_dir/SHA256SUMS"
          find "$dist_dir" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: TaskPilot-${{ steps.version.outputs.tag }}-signed
          path: ${{ runner.temp }}/taskpilot-apks/*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release with signed APKs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "$RUNNER_TEMP"/taskpilot-apks/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "TaskPilot $VERSION_NAME" \
            --generate-notes
